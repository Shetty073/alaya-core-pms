version: '3.8'

services:
  # 1. Database Service (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: alaya-pms-db
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${PORT_DB:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 6
    restart: always

  # 2. Backend Service (Quarkus REST API)
  backend:
    build:
      context: ./backend-app
      dockerfile: Dockerfile
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_JDBC_URL: ${DB_JDBC_URL:-jdbc:postgresql://db:5432/postgres}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    restart: always

  # 3. Frontend Service (Angular + Nginx SPA Server)
  frontend:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    depends_on:
      - backend
    deploy:
      replicas: ${FRONTEND_REPLICAS:-2}
    restart: always

  # 4. Gateway Service (Nginx Reverse Proxy & Load Balancer)
  gateway:
    image: nginx:1.25-alpine
    container_name: alaya-pms-gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PORT_GATEWAY:-80}:80"
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data:
    driver: local
